// SUPABASE READY — normalize a row into frontend shape
function normalizeSupabaseArtist(row) {
  return {
    id: row.id,
    created_at: row.created_at,
    is_sample: false,
    name: row.name,
    email: row.email,
    city: row.city,
    home_scene: row.home_scene,
    also_active_in: row.also_active_in || [row.home_scene],
    genres: row.genres || [],
    bio: row.bio || '',
    verified: row.verified || false,
    status: row.status || ARTIST_STATUS.APPROVED,
    color: row.color || AVATAR_COLORS[Math.floor(Math.random() * AVATAR_COLORS.length)],
    soundcloud_profile_url: row.soundcloud_profile_url || null,
    featured_track_url: row.featured_track_url || null,
    instagram: row.instagram || null,
    website: row.website || null,
    booking_email: row.booking_email || null,
    tracks: row.tracks || [],
    shows: row.shows || [],
  };
}

// SUPABASE READY — fetch all approved artists
async function fetchApprovedArtists() {
  if (!supabase) return [];
  try {
    const { data, error } = await supabase
      .from('artists')
      .select('*')
      .eq('status', 'approved');
    if (error) { console.error('[RADR] Supabase fetch error:', error); return []; }
    return (data || []).map(normalizeSupabaseArtist);
  } catch (err) {
    console.error('[RADR] Supabase fetch exception:', err);
    return [];
  }
}

// SUPABASE READY — fetch approved artists by scene
async function fetchApprovedArtistsByScene(sceneId) {
  if (!supabase) return [];
  try {
    const { data, error } = await supabase
      .from('artists')
      .select('*')
      .eq('status', 'approved')
      .eq('home_scene', sceneId);
    if (error) { console.error('[RADR] Supabase scene fetch error:', error); return []; }
    return (data || []).map(normalizeSupabaseArtist);
  } catch (err) {
    console.error('[RADR] Supabase scene fetch exception:', err);
    return [];
  }
}

// SUPABASE READY — submit artist as pending
async function submitArtistToSupabase(payload) {
  if (!supabase) return { success: false, error: 'Supabase not configured' };
  try {
    const { data, error } = await supabase
      .from('artists')
      .insert([{
        name: payload.name,
        email: payload.email,
        city: payload.city,
        home_scene: payload.home_scene,
        also_active_in: payload.also_active_in,
        genres: payload.genres,
        bio: payload.bio,
        soundcloud_profile_url: payload.soundcloud_profile_url || null,
        featured_track_url: payload.featured_track_url || null,
        instagram: payload.instagram || null,
        website: payload.website || null,
        booking_email: payload.booking_email || null,
        local_presence: payload.local_presence || null,
        music_links: payload.music_links || null,
        tracks: payload.tracks || [],
        shows: payload.shows || [],
        status: 'pending',
        is_sample: false,
        color: payload.color,
        verified: false,
      }]);
    if (error) { console.error('[RADR] Supabase insert error:', error); return { success: false, error: error.message }; }
    return { success: true, data };
  } catch (err) {
    console.error('[RADR] Supabase insert exception:', err);
    return { success: false, error: err.message };
  }
}

const genId = () => '_' + Math.random().toString(36).slice(2, 10);
const getInitials = (name) => name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
const formatPlays = (n) => n >= 1000 ? (n/1000).toFixed(1).replace(/\.0$/,'') + 'K' : String(n);
const isVisiting = (artist, sceneId) => artist.home_scene !== sceneId && (artist.also_active_in || []).includes(sceneId);
const pickColor = () => AVATAR_COLORS[Math.floor(Math.random() * AVATAR_COLORS.length)];
const sceneName = (id) => SCENES.find(s => s.id === id)?.name || id;
const getStatusLabel = (artist) => STATUS_LABELS[artist.status] || (artist.verified ? 'Verified Local' : 'Artist');
const getStatusVariant = (status) => ({ [ARTIST_STATUS.VERIFIED_LOCAL]: 'verified', [ARTIST_STATUS.COMMUNITY_CONFIRMED]: 'community', [ARTIST_STATUS.NEW_ARTIST]: 'newartist', [ARTIST_STATUS.UNDER_REVIEW]: 'review', [ARTIST_STATUS.APPROVED]: 'verified', [ARTIST_STATUS.PENDING]: 'review' }[status] || 'default');

function getSceneArtists(artists, sceneId) { return artists.filter(a => a.home_scene === sceneId || (a.also_active_in || []).includes(sceneId)); }
function getHomeArtists(artists, sceneId) { return artists.filter(a => a.home_scene === sceneId); }
function getVisitingArtists(artists, sceneId) { return artists.filter(a => a.home_scene !== sceneId && (a.also_active_in || []).includes(sceneId)); }
function getSceneShows(artists, sceneId) {
  return getSceneArtists(artists, sceneId).flatMap(a => (a.shows || []).map(s => ({...s, artist: a.name, artistId: a.id}))).sort((a,b) => new Date(a.date) - new Date(b.date));
}
function getSceneStats(artists, sceneId) {
  const home = getHomeArtists(artists, sceneId);
  const visiting = getVisitingArtists(artists, sceneId);
  const shows = getSceneShows(artists, sceneId);
  return { homeCount: home.length, visitingCount: visiting.length, showCount: shows.length, totalArtists: home.length + visiting.length };
}

function saveScene(id) { localStorage.setItem(STORAGE_SCENE, id); }
function loadSuggestedScenes() { try { return JSON.parse(localStorage.getItem(STORAGE_SUGGESTED_SCENES) || '[]'); } catch { return []; } }
function saveSuggestedScenes(list) { localStorage.setItem(STORAGE_SUGGESTED_SCENES, JSON.stringify(list)); }

function Card({ children, onClick, style: extra, hover = true }) {
  const [hovered, setHovered] = useState(false);
  return (
    <div onClick={onClick} onMouseEnter={() => setHovered(true)} onMouseLeave={() => setHovered(false)} style={{
      background: hovered && hover ? CARD_BG_HOVER : CARD_BG, border: `1px solid ${hovered && hover ? ACCENT+'30' : BORDER}`,
      borderRadius: 16, padding: 24, cursor: onClick ? 'pointer' : 'default',
      transform: hovered && hover ? 'translateY(-4px)' : 'none', transition: 'all 0.25s cubic-bezier(0.4,0,0.2,1)',
      boxShadow: hovered && hover ? '0 12px 40px rgba(0,229,160,0.06)' : 'none', ...extra
    }}>{children}</div>
  );
}

function Section({ title, subtitle, children, action, style: extra }) {
  return (
    <section style={{ marginBottom: 56, ...extra }}>
      <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', marginBottom: 24, flexWrap: 'wrap', gap: 12 }}>
        <div>
          <h2 style={{ fontFamily: 'Syne, sans-serif', fontWeight: 700, fontSize: 24, letterSpacing: '-0.02em' }}>{title}</h2>
          {subtitle && <p style={{ fontSize: 14, color: TEXT_DIM, marginTop: 4 }}>{subtitle}</p>}
        </div>
        {action}
      </div>
      {children}
    </section>
  );
}

function Modal({ open, onClose, children, title }) {
  if (!open) return null;
  return (
    <div onClick={onClose} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.7)', backdropFilter: 'blur(8px)', zIndex: 300, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
      <div onClick={e => e.stopPropagation()} style={{ background: '#12121f', border: `1px solid ${BORDER}`, borderRadius: 20, padding: 32, maxWidth: 500, width: '100%', maxHeight: '85vh', overflowY: 'auto', animation: 'fadeIn 0.2s ease-out' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 24 }}>
          <h3 style={{ fontFamily: 'Syne, sans-serif', fontWeight: 700, fontSize: 20 }}>{title}</h3>
          <button onClick={onClose} style={{ background: 'none', border: 'none', color: TEXT_DIM, fontSize: 20, cursor: 'pointer', padding: 4 }}>×</button>
        </div>
        {children}
      </div>
    </div>
  );
}

    <div style={{ background: CARD_BG, borderBottom: `1px solid ${BORDER}`, padding: '10px 24px', marginTop: 64 }}>
      <div className="scene-bar-inner" style={{ maxWidth: 1100, margin: '0 auto', display: 'flex', alignItems: 'center', gap: 20, fontSize: 13, color: TEXT_MED }}>

          <span style={{ width: 6, height: 6, borderRadius: '50%', background: ACCENT, boxShadow: `0 0 6px ${ACCENT}` }} />
          <span style={{ fontFamily: 'Syne, sans-serif', fontWeight: 700, color: ACCENT }}>{scene.name} Scene</span>
        </span>
        <span style={{ color: TEXT_DIM }}>·</span>
        <span>{stats.totalArtists} artist{stats.totalArtists !== 1 ? 's' : ''}</span>
        {stats.visitingCount > 0 && <><span style={{ color: TEXT_DIM }}>·</span><span>{stats.visitingCount} visiting</span></>}
        <span style={{ color: TEXT_DIM }}>·</span>
        <span>{stats.showCount} upcoming show{stats.showCount !== 1 ? 's' : ''}</span>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════

   ═══════════════════════════════════════════ */
function SceneSelector({ current, onChange, artists, onSuggestScene }) {
  const [open, setOpen] = useState(false);

              <button key={s.id} onClick={() => { onChange(s.id); setOpen(false); }} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', width: '100%', textAlign: 'left', padding: '10px 12px', background: s.id === current ? ACCENT+'10' : 'transparent', border: 'none', borderRadius: 8, color: s.id === current ? ACCENT : '#e8e8ec', fontSize: 14, fontFamily: 'Syne, sans-serif', fontWeight: s.id === current ? 600 : 400, cursor: 'pointer' }}

                <div>{s.name}<span style={{ display: 'block', fontSize: 11, color: TEXT_DIM, marginTop: 1 }}>{s.cities.slice(0,3).join(', ')}</span></div>

              + Suggest a Scene

          </div>
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════
   MINI PLAYER
   ═══════════════════════════════════════════ */
function MiniPlayer({ track, artist, playing, onToggle, progress, onProgressChange }) {
  const iframeRef = useRef(null); const widgetRef = useRef(null);
  const hasSC = track && !!track.soundcloudUrl;
  useEffect(() => { if (!hasSC || !iframeRef.current) return; const widget = SC.Widget(iframeRef.current); widgetRef.current = widget; widget.bind(SC.Widget.Events.READY, () => { widget.bind(SC.Widget.Events.PLAY_PROGRESS, (data) => { onProgressChange(data.relativePosition * 100); }); widget.bind(SC.Widget.Events.FINISH, () => { onToggle(false); }); if (playing) widget.play(); }); return () => { widgetRef.current = null; }; }, [track?.soundcloudUrl]);
  useEffect(() => { if (!hasSC || !widgetRef.current) return; if (playing) widgetRef.current.play(); else widgetRef.current.pause(); }, [playing, hasSC]);
  if (!track) return null;
  return (
    <div style={{ position: 'fixed', bottom: 0, left: 0, right: 0, background: '#0c0c18ee', backdropFilter: 'blur(20px)', borderTop: `1px solid ${BORDER}`, zIndex: 200 }}>
      {hasSC && <iframe ref={iframeRef} key={track.soundcloudUrl} src={`https://w.soundcloud.com/player/?url=${encodeURIComponent(track.soundcloudUrl)}&color=%2300e5a0&auto_play=${playing}&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false`} width="0" height="0" frameBorder="0" allow="autoplay" style={{ position: 'absolute', opacity: 0, pointerEvents: 'none' }} />}
      <div style={{ height: 3, background: BORDER }}><div style={{ width: `${progress}%`, height: '100%', background: ACCENT, transition: hasSC ? 'none' : 'width 1s linear', borderRadius: 2 }} /></div>
      <div style={{ height: 68, display: 'flex', alignItems: 'center', padding: '0 24px', gap: 16 }}>
        <Avatar name={artist.name} color={artist.color} size={42} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 14, fontWeight: 600, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{track.title}</div>
          <div style={{ fontSize: 12, color: TEXT_DIM, display: 'flex', alignItems: 'center', gap: 6 }}>{artist.name}{hasSC ? <span style={{ color: '#ff5500', fontSize: 10, fontWeight: 700 }}>● Full Stream</span> : <span style={{ fontSize: 10, color: TEXT_DIM }}>● Preview</span>}</div>
        </div>
        <Equalizer playing={playing} />
        <button onClick={() => onToggle()} style={{ width: 40, height: 40, borderRadius: '50%', background: ACCENT, border: 'none', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', fontSize: 16, color: '#08080f', fontWeight: 700, flexShrink: 0 }}>{playing ? '❚❚' : '▶'}</button>
        <span style={{ fontSize: 12, color: TEXT_DIM, width: 40, textAlign: 'right' }}>{track.duration}</span>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════
   SUGGEST A SCENE MODAL
   ═══════════════════════════════════════════ */
function SuggestSceneModal({ open, onClose, onSubmit }) {
  const [form, setForm] = useState({ name: '', country: '', description: '', links: '' });
  const [submitted, setSubmitted] = useState(false);
  const inputStyle = { width: '100%', padding: '12px 16px', background: '#0a0a16', border: `1px solid ${BORDER}`, borderRadius: 10, color: '#e8e8ec', fontSize: 14, outline: 'none' };
  const labelStyle = { display: 'block', fontFamily: 'Syne, sans-serif', fontWeight: 600, fontSize: 13, marginBottom: 8, color: TEXT_MED };
  const focus = (e) => e.target.style.borderColor = ACCENT;
  const blur = (e) => e.target.style.borderColor = BORDER;

  const handleSubmit = () => {
    if (!form.name) return;
    onSubmit({ id: genId(), name: form.name, country: form.country || 'US', description: form.description, links: form.links, status: 'pending', submittedAt: new Date().toISOString() });
    setSubmitted(true);
  };

  if (submitted) return (
    <Modal open={open} onClose={() => { setSubmitted(false); setForm({ name: '', country: '', description: '', links: '' }); onClose(); }} title="Scene Suggested">
      <p style={{ color: TEXT_MED, fontSize: 14, lineHeight: 1.6, marginBottom: 8 }}>Thanks for suggesting <strong>{form.name}</strong>. Suggested scenes are reviewed before going live — we look for local artist activity and real venues.</p>
      <p style={{ color: TEXT_DIM, fontSize: 13 }}>Want to help? Join RADR as an artist in this area to build momentum.</p>
    </Modal>
  );

  return (
    <Modal open={open} onClose={onClose} title="Suggest a Scene">
      <p style={{ color: TEXT_DIM, fontSize: 13, marginBottom: 20 }}>Scenes go live after review or when enough artists from the area join RADR. Use the format: City / Region.</p>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
        <div><label style={labelStyle}>Scene Name (City / Region) *</label><input style={inputStyle} value={form.name} onChange={e => setForm(f => ({...f, name: e.target.value}))} placeholder="Los Angeles / Southern California" onFocus={focus} onBlur={blur} /></div>
        <div><label style={labelStyle}>Country</label><input style={inputStyle} value={form.country} onChange={e => setForm(f => ({...f, country: e.target.value}))} placeholder="US" onFocus={focus} onBlur={blur} /></div>
        <div><label style={labelStyle}>Description (optional)</label><textarea style={{...inputStyle, minHeight: 60, resize: 'vertical'}} value={form.description} onChange={e => setForm(f => ({...f, description: e.target.value}))} placeholder="What makes this scene unique?" onFocus={focus} onBlur={blur} /></div>
        <div><label style={labelStyle}>Known artists, venues, or links (optional)</label><textarea style={{...inputStyle, minHeight: 50, resize: 'vertical'}} value={form.links} onChange={e => setForm(f => ({...f, links: e.target.value}))} placeholder="Help us understand the scene" onFocus={focus} onBlur={blur} /></div>
        <button onClick={handleSubmit} style={{ width: '100%', padding: '14px 24px', background: form.name ? ACCENT : BORDER, border: 'none', borderRadius: 10, color: form.name ? '#08080f' : TEXT_DIM, fontFamily: 'Syne, sans-serif', fontWeight: 700, fontSize: 15, cursor: form.name ? 'pointer' : 'not-allowed' }}>Suggest This Scene</button>
      </div>
    </Modal>
  );
}

/* ═══════════════════════════════════════════
   DISCOVER PAGE
   ═══════════════════════════════════════════ */
function DiscoverPage({ scene, artists, setPage, setSelectedArtist, onPlay, currentTrack, playing }) {
  const [genre, setGenre] = useState(null);
  const [sort, setSort] = useState('trending');
  const allArtists = getSceneArtists(artists, scene.id);
  let filtered = genre ? allArtists.filter(a => a.genres.includes(genre)) : allArtists;
  if (sort === 'trending') filtered = [...filtered].sort((a,b) => (b.tracks||[]).reduce((s,t)=>s+t.plays,0) - (a.tracks||[]).reduce((s,t)=>s+t.plays,0));
  if (sort === 'newest') filtered = [...filtered].reverse();
  const filteredHome = filtered.filter(a => a.home_scene === scene.id);
  const filteredVisiting = filtered.filter(a => a.home_scene !== scene.id);
  const goArtist = (a) => { setSelectedArtist(a); setPage('artist'); };
  useEffect(() => { setGenre(null); }, [scene.id]);
  const hasSamples = filtered.some(a => a.is_sample);

  return (
    <div style={{ maxWidth: 1100, margin: '0 auto', padding: '100px 24px 120px' }}>
      <div style={{ marginBottom: 40 }}>
        <h1 style={{ fontFamily: 'Syne, sans-serif', fontWeight: 800, fontSize: 36, marginBottom: 8 }}>Discover</h1>
        <p style={{ color: TEXT_DIM, fontSize: 16 }}>Artists in the {scene.name} scene</p>
      </div>
      {hasSamples && <EarlyAccessDisclaimer />}
      <div style={{ display: 'flex', alignItems: 'center', gap: 16, marginBottom: 32, flexWrap: 'wrap' }}>
        <GenreChips genres={['All', ...GENRES]} active={genre || 'All'} onSelect={g => setGenre(g === 'All' ? null : g)} />
        <div style={{ marginLeft: 'auto', display: 'flex', gap: 8 }}>
          {['trending','newest'].map(s => (
            <button key={s} onClick={() => setSort(s)} style={{ padding: '6px 14px', borderRadius: 8, border: `1px solid ${sort === s ? ACCENT : BORDER}`, background: sort === s ? ACCENT+'15' : 'transparent', color: sort === s ? ACCENT : TEXT_DIM, fontFamily: 'Syne, sans-serif', fontWeight: 500, fontSize: 12, cursor: 'pointer', textTransform: 'capitalize' }}>{s}</button>
          ))}
        </div>
      </div>
      {filteredHome.length > 0 && <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(320px, 1fr))', gap: 20, marginBottom: 48 }}>{filteredHome.map(a => <ArtistCard key={a.id} artist={a} sceneId={scene.id} onSelect={() => goArtist(a)} />)}</div>}
      {filteredVisiting.length > 0 && <Section title="Visiting Artists" subtitle={`From other scenes, touring through ${scene.name}`}><div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(320px, 1fr))', gap: 20 }}>{filteredVisiting.map(a => <ArtistCard key={a.id} artist={a} sceneId={scene.id} onSelect={() => goArtist(a)} />)}</div></Section>}
      {filtered.length === 0 && <div style={{ textAlign: 'center', padding: 60, color: TEXT_DIM }}><p style={{ fontFamily: 'Syne, sans-serif', fontSize: 18 }}>No artists in {scene.name} yet.</p><p style={{ fontSize: 14, marginTop: 8 }}>Be the first — <span style={{ color: ACCENT, cursor: 'pointer' }} onClick={() => setPage('submit')}>join RADR</span>.</p></div>}
    </div>
  );
}

/* ═══════════════════════════════════════════
   SUBMIT / JOIN PAGE
   SUPABASE READY — submits to Supabase when
   configured, otherwise logs to console as demo.
   ═══════════════════════════════════════════ */
function SubmitPage({ scenes, onSuggestScene }) {
  const [step, setStep] = useState(1);
  const [submitting, setSubmitting] = useState(false);
  const [submitError, setSubmitError] = useState(null);
  const [form, setForm] = useState({
    name: '', type: 'solo', email: '', city: '', home_scene: '',
    also_active_in: [], genres: [], bio: '',
    soundcloud_profile_url: '', featured_track_url: '',
    music_links: '', local_presence: '',
    instagram: '', website: '', booking_email: '',
    upcoming_shows: '', human_confirmed: false, live_confirmed: false,
  });
  const [tracks, setTracks] = useState([]);
  const [trackInput, setTrackInput] = useState({ title: '', soundcloudUrl: '', duration: '' });
  const update = (field, value) => setForm(f => ({...f, [field]: value}));

  const addTrack = () => {
    if (!trackInput.title) return;
    setTracks(t => [...t, { id: genId(), title: trackInput.title, soundcloudUrl: trackInput.soundcloudUrl || null, duration: trackInput.duration || '3:30', plays: 0 }]);
    setTrackInput({ title: '', soundcloudUrl: '', duration: '' });
  };
  const removeTrack = (id) => setTracks(t => t.filter(tr => tr.id !== id));

  const submitArtist = async () => {
    setSubmitting(true);
    setSubmitError(null);
    const dedupedScenes = [form.home_scene, ...form.also_active_in.filter(s => s !== form.home_scene)];
    const payload = {
      name: form.name, email: form.email, city: form.city,
      home_scene: form.home_scene, also_active_in: dedupedScenes,
      genres: form.genres.length > 0 ? form.genres : ['Other'],
      bio: form.bio || `Independent artist from ${form.city}.`,
      soundcloud_profile_url: form.soundcloud_profile_url || null,
      featured_track_url: form.featured_track_url || null,
      instagram: form.instagram || null,
      website: form.website || null,
      booking_email: form.booking_email || null,
      local_presence: form.local_presence || null,
      music_links: form.music_links || null,
      tracks: tracks,
      shows: form.upcoming_shows ? form.upcoming_shows.split('\n').filter(Boolean).map(line => {
        const parts = line.split(',').map(s => s.trim());
        return { venue: parts[1] || 'TBA', city: parts[2] || form.city, date: parts[0] || '2026-05-01', time: parts[3] || '8:00 PM' };
      }) : [],
      color: pickColor(),
    };
    // SUPABASE READY
    if (SUPABASE_CONFIGURED) {
      const result = await submitArtistToSupabase(payload);
      if (!result.success) { setSubmitError(result.error || 'Submission failed. Please try again.'); setSubmitting(false); return; }
    } else {
      console.log('[RADR] Demo mode — artist submission payload:', payload);
    }
    setSubmitting(false);
    setStep(3);
  };

  const inputStyle = { width: '100%', padding: '12px 16px', background: '#0a0a16', border: `1px solid ${BORDER}`, borderRadius: 10, color: '#e8e8ec', fontSize: 14, outline: 'none', transition: 'border-color 0.2s' };
  const labelStyle = { display: 'block', fontFamily: 'Syne, sans-serif', fontWeight: 600, fontSize: 13, marginBottom: 8, color: TEXT_MED };
  const focus = (e) => e.target.style.borderColor = ACCENT;
  const blur = (e) => e.target.style.borderColor = BORDER;
  const canProceed1 = form.name && form.email && form.home_scene && form.human_confirmed;

  if (step === 3) return (
    <div style={{ maxWidth: 600, margin: '0 auto', padding: '160px 24px', textAlign: 'center' }}>
      <div style={{ width: 64, height: 64, borderRadius: '50%', background: ACCENT+'20', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 24px', fontSize: 28, color: ACCENT }}>✓</div>
      <h1 style={{ fontFamily: 'Syne, sans-serif', fontWeight: 800, fontSize: 32, marginBottom: 12 }}>Submission Received</h1>
      <p style={{ color: TEXT_MED, fontSize: 16, lineHeight: 1.6, marginBottom: 12 }}>Your profile has been submitted to the {sceneName(form.home_scene)} scene.</p>
      <p style={{ color: TEXT_DIM, fontSize: 14, lineHeight: 1.5, marginBottom: 32 }}>Submissions are reviewed before going live. You'll appear on RADR once approved. This helps keep the platform focused on real artists in real scenes.</p>
      <button onClick={() => { setStep(1); setForm({ name:'',type:'solo',email:'',city:'',home_scene:'',also_active_in:[],genres:[],bio:'',soundcloud_profile_url:'',featured_track_url:'',music_links:'',local_presence:'',instagram:'',website:'',booking_email:'',upcoming_shows:'',human_confirmed:false,live_confirmed:false }); setTracks([]); }}
        style={{ padding: '12px 24px', background: 'transparent', border: `1px solid ${BORDER}`, borderRadius: 10, color: '#e8e8ec', fontFamily: 'Syne, sans-serif', fontWeight: 600, fontSize: 14, cursor: 'pointer' }}>Submit Another Artist</button>
    </div>
  );

  return (
    <div style={{ maxWidth: 640, margin: '0 auto', padding: '100px 24px 120px' }}>
      <h1 style={{ fontFamily: 'Syne, sans-serif', fontWeight: 800, fontSize: 36, marginBottom: 8 }}>Join RADR</h1>
      <p style={{ color: TEXT_MED, fontSize: 16, marginBottom: 4 }}>Add yourself to your scene and start getting discovered.</p>
      <p style={{ color: TEXT_DIM, fontSize: 14, marginBottom: 32 }}>Built for real artists in real places.</p>
      {!SUPABASE_CONFIGURED && <div style={{ padding: '10px 20px', background: '#fdcb6e12', border: `1px solid #fdcb6e25`, borderRadius: 10, marginBottom: 24, fontSize: 13, color: '#fdcb6e' }}>Demo mode — submissions are logged to console. Connect Supabase to enable real submissions.</div>}
      <div style={{ display: 'flex', gap: 8, marginBottom: 40 }}>
        {[{ n:1, label:'Your Info' },{ n:2, label:'Your Music' }].map(s => (
          <div key={s.n} style={{ flex: 1, padding: '10px 16px', borderRadius: 10, background: step >= s.n ? ACCENT+'12' : CARD_BG, border: `1px solid ${step >= s.n ? ACCENT+'30' : BORDER}`, textAlign: 'center' }}>
            <span style={{ fontFamily: 'Syne, sans-serif', fontWeight: 600, fontSize: 12, color: step >= s.n ? ACCENT : TEXT_DIM }}>{s.n}. {s.label}</span>
          </div>
        ))}
      </div>

      {step === 1 && (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
          <div className="grid-2col" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
            <div><label style={labelStyle}>Artist / Band Name *</label><input style={inputStyle} value={form.name} onChange={e => update('name', e.target.value)} placeholder="Your name or band name" onFocus={focus} onBlur={blur} /></div>
            <div><label style={labelStyle}>Type *</label>
              <select style={{...inputStyle, cursor: 'pointer'}} value={form.type} onChange={e => update('type', e.target.value)}>
                <option value="solo">Solo Artist</option><option value="band">Band</option><option value="duo">Duo</option><option value="collective">Collective</option>
              </select>
            </div>
          </div>
          <div><label style={labelStyle}>Email *</label><input style={inputStyle} type="email" value={form.email} onChange={e => update('email', e.target.value)} placeholder="you@email.com" onFocus={focus} onBlur={blur} /></div>
          <div className="grid-2col" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
            <div><label style={labelStyle}>City *</label><input style={inputStyle} value={form.city} onChange={e => update('city', e.target.value)} placeholder="Your city" onFocus={focus} onBlur={blur} /></div>
            <div><label style={labelStyle}>Home Scene *</label>
              <select style={{...inputStyle, cursor:'pointer'}} value={form.home_scene} onChange={e => { if (e.target.value === '__suggest__') { onSuggestScene(); } else { update('home_scene', e.target.value); } }}>
                <option value="">Select your scene</option>
                {scenes.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                <option value="__suggest__">+ Suggest a Scene</option>
              </select>
            </div>
          </div>
          <div>
            <label style={labelStyle}>Also Active In (scenes you tour)</label>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
              {scenes.filter(s => s.id !== form.home_scene).map(s => {
                const active = form.also_active_in.includes(s.id);
                return <button key={s.id} type="button" onClick={() => update('also_active_in', active ? form.also_active_in.filter(x => x !== s.id) : [...form.also_active_in, s.id])} style={{ padding: '6px 14px', borderRadius: 20, border: `1px solid ${active ? ACCENT : BORDER}`, background: active ? ACCENT+'18' : 'transparent', color: active ? ACCENT : TEXT_DIM, fontSize: 12, fontFamily: 'Syne, sans-serif', cursor: 'pointer' }}>{s.name}</button>;
              })}
            </div>
          </div>
          <div>
            <label style={labelStyle}>Genres (up to 3) *</label>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
              {GENRES.map(g => {
                const active = form.genres.includes(g);
                return <button key={g} type="button" onClick={() => { if (active) update('genres', form.genres.filter(x => x !== g)); else if (form.genres.length < 3) update('genres', [...form.genres, g]); }} style={{ padding: '6px 14px', borderRadius: 20, border: `1px solid ${active ? ACCENT : BORDER}`, background: active ? ACCENT+'18' : 'transparent', color: active ? ACCENT : TEXT_DIM, fontSize: 12, fontFamily: 'Syne, sans-serif', cursor: 'pointer' }}>{g}</button>;
              })}
            </div>
          </div>
          <div><label style={labelStyle}>Bio *</label><textarea style={{...inputStyle, minHeight: 100, resize: 'vertical'}} value={form.bio} onChange={e => update('bio', e.target.value)} placeholder="Tell listeners about your sound, story, and scene." onFocus={focus} onBlur={blur} /></div>
          {/* SoundCloud fields — SUPABASE READY */}
          <div style={{ borderTop: `1px solid ${BORDER}`, paddingTop: 20 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 16 }}>
              <span style={{ color: '#ff5500', fontSize: 20 }}>☁</span>
              <span style={{ fontFamily: 'Syne, sans-serif', fontWeight: 700, fontSize: 15 }}>SoundCloud</span>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
              <div><label style={labelStyle}>SoundCloud Profile URL</label><input style={inputStyle} value={form.soundcloud_profile_url} onChange={e => update('soundcloud_profile_url', e.target.value)} placeholder="https://soundcloud.com/yourname" onFocus={e => e.target.style.borderColor='#ff5500'} onBlur={blur} /></div>
              <div><label style={labelStyle}>Featured Track URL (optional)</label><input style={inputStyle} value={form.featured_track_url} onChange={e => update('featured_track_url', e.target.value)} placeholder="https://soundcloud.com/yourname/track-name" onFocus={e => e.target.style.borderColor='#ff5500'} onBlur={blur} /><p style={{ fontSize: 11, color: TEXT_DIM, marginTop: 6 }}>This track will be embedded on your RADR profile for instant listening.</p></div>
            </div>
          </div>
          <div><label style={labelStyle}>Other Music Links (optional)</label><textarea style={{...inputStyle, minHeight: 50, resize: 'vertical'}} value={form.music_links} onChange={e => update('music_links', e.target.value)} placeholder="Bandcamp, Spotify, YouTube — one per line" onFocus={focus} onBlur={blur} /></div>
          <div><label style={labelStyle}>Local Presence (optional)</label><input style={inputStyle} value={form.local_presence} onChange={e => update('local_presence', e.target.value)} placeholder="Recent show, venue, or link that connects you to your local scene" onFocus={focus} onBlur={blur} /><p style={{ fontSize: 11, color: TEXT_DIM, marginTop: 6 }}>Helps verify your connection to the scene.</p></div>
          <div style={{ borderTop: `1px solid ${BORDER}`, paddingTop: 20 }}>
            <div style={{ fontFamily: 'Syne, sans-serif', fontWeight: 700, fontSize: 15, marginBottom: 16 }}>Links & Contact</div>
            <div className="grid-2col" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
              <div><label style={labelStyle}>Instagram</label><input style={inputStyle} value={form.instagram} onChange={e => update('instagram', e.target.value)} placeholder="@handle" onFocus={focus} onBlur={blur} /></div>
              <div><label style={labelStyle}>Website</label><input style={inputStyle} value={form.website} onChange={e => update('website', e.target.value)} placeholder="https://..." onFocus={focus} onBlur={blur} /></div>
              <div><label style={labelStyle}>Booking Email</label><input style={inputStyle} type="email" value={form.booking_email} onChange={e => update('booking_email', e.target.value)} placeholder="booking@..." onFocus={focus} onBlur={blur} /></div>
            </div>
          </div>
          <div><label style={labelStyle}>Upcoming Shows (one per line: date, venue, city, time)</label><textarea style={{...inputStyle, minHeight: 60, resize: 'vertical'}} value={form.upcoming_shows} onChange={e => update('upcoming_shows', e.target.value)} placeholder="2026-05-01, Songbyrd, Washington DC, 8:00 PM" onFocus={focus} onBlur={blur} /></div>
          <label style={{ display: 'flex', alignItems: 'flex-start', gap: 12, cursor: 'pointer', padding: 14, background: CARD_BG, borderRadius: 12, border: `1px solid ${BORDER}` }}>
            <input type="checkbox" checked={form.human_confirmed} onChange={e => update('human_confirmed', e.target.checked)} style={{ marginTop: 2, accentColor: ACCENT, width: 18, height: 18 }} />
            <div><div style={{ fontFamily: 'Syne, sans-serif', fontWeight: 600, fontSize: 14 }}>I am a real human artist</div><div style={{ fontSize: 12, color: TEXT_DIM, marginTop: 2 }}>I confirm this is original music from a real person or group.</div></div>
          </label>
          <label style={{ display: 'flex', alignItems: 'flex-start', gap: 12, cursor: 'pointer', padding: 14, background: CARD_BG, borderRadius: 12, border: `1px solid ${BORDER}` }}>
            <input type="checkbox" checked={form.live_confirmed} onChange={e => update('live_confirmed', e.target.checked)} style={{ marginTop: 2, accentColor: ACCENT, width: 18, height: 18 }} />
            <div><div style={{ fontFamily: 'Syne, sans-serif', fontWeight: 600, fontSize: 14 }}>I actively perform or participate in my local music scene</div><div style={{ fontSize: 12, color: TEXT_DIM, marginTop: 2 }}>I (or my group) am connected to and active in a local scene.</div></div>
          </label>
          <p style={{ fontSize: 12, color: TEXT_DIM, lineHeight: 1.5, padding: '12px 16px', background: CARD_BG, borderRadius: 10, border: `1px solid ${BORDER}` }}>Profiles may be reviewed or flagged to help keep RADR focused on real artists and local scenes.</p>
          <button onClick={() => canProceed1 && setStep(2)} style={{ padding: '16px 32px', background: canProceed1 ? ACCENT : BORDER, border: 'none', borderRadius: 12, color: canProceed1 ? '#08080f' : TEXT_DIM, fontFamily: 'Syne, sans-serif', fontWeight: 700, fontSize: 16, cursor: canProceed1 ? 'pointer' : 'not-allowed', width: '100%' }}>Next: Add Your Tracks →</button>
        </div>
      )}

      {step === 2 && (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 24 }}>
          <Card hover={false} style={{ background: '#0a0a16', border: `1px solid ${ACCENT}20` }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
              <span style={{ color: '#ff5500', fontSize: 20 }}>☁</span>
              <div><div style={{ fontFamily: 'Syne, sans-serif', fontWeight: 700, fontSize: 16 }}>Link Your Tracks</div><div style={{ fontSize: 13, color: TEXT_DIM }}>Paste SoundCloud URLs for full streaming on RADR. Tracks without a link appear as previews.</div></div>
            </div>
          </Card>
          <div style={{ padding: 20, background: CARD_BG, borderRadius: 14, border: `1px solid ${BORDER}` }}>
            <label style={labelStyle}>Add a Track</label>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
              <input style={inputStyle} placeholder="Track title *" value={trackInput.title} onChange={e => setTrackInput(t => ({...t, title: e.target.value}))} onFocus={focus} onBlur={blur} />
              <input style={inputStyle} placeholder="SoundCloud URL (optional)" value={trackInput.soundcloudUrl} onChange={e => setTrackInput(t => ({...t, soundcloudUrl: e.target.value}))} onFocus={e => e.target.style.borderColor='#ff5500'} onBlur={blur} />
              <div style={{ display: 'flex', gap: 12 }}>
                <input style={{...inputStyle, maxWidth: 120}} placeholder="Duration" value={trackInput.duration} onChange={e => setTrackInput(t => ({...t, duration: e.target.value}))} onFocus={focus} onBlur={blur} />
                <button onClick={addTrack} disabled={!trackInput.title} style={{ padding: '12px 24px', background: trackInput.title ? ACCENT : BORDER, border: 'none', borderRadius: 10, color: trackInput.title ? '#08080f' : TEXT_DIM, fontFamily: 'Syne, sans-serif', fontWeight: 700, fontSize: 14, cursor: trackInput.title ? 'pointer' : 'not-allowed', whiteSpace: 'nowrap' }}>+ Add Track</button>
              </div>
            </div>
          </div>
          {tracks.length > 0 && (
            <div>
              <label style={{...labelStyle, marginBottom: 12}}>{tracks.length} track{tracks.length !== 1 ? 's' : ''} added</label>
              {tracks.map((t, i) => (
                <div key={t.id} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '12px 16px', background: CARD_BG, borderRadius: 10, marginBottom: 8, border: `1px solid ${BORDER}` }}>
                  <span style={{ fontFamily: 'Syne, sans-serif', fontSize: 13, color: TEXT_DIM, width: 24 }}>{i+1}</span>
                  <div style={{ flex: 1 }}><div style={{ fontSize: 14, fontWeight: 500 }}>{t.title}</div><div style={{ fontSize: 11, color: t.soundcloudUrl ? '#ff5500' : TEXT_DIM }}>{t.soundcloudUrl ? '● Full stream linked' : '● Preview only'}</div></div>
                  <span style={{ fontSize: 12, color: TEXT_DIM }}>{t.duration}</span>
                  <button onClick={() => removeTrack(t.id)} style={{ background: 'none', border: 'none', color: '#e84050', cursor: 'pointer', fontSize: 18, padding: 4, lineHeight: 1 }}>×</button>
                </div>
              ))}
            </div>
          )}
          {submitError && <div style={{ padding: '12px 20px', background: '#e8405012', border: `1px solid #e8405030`, borderRadius: 10, fontSize: 13, color: '#e84050' }}>{submitError}</div>}
          <div style={{ display: 'flex', gap: 12 }}>
            <button onClick={() => setStep(1)} style={{ padding: '16px 24px', background: 'transparent', border: `1px solid ${BORDER}`, borderRadius: 12, color: '#e8e8ec', fontFamily: 'Syne, sans-serif', fontWeight: 600, fontSize: 15, cursor: 'pointer', flex: 1 }}>← Back</button>
            <button onClick={submitArtist} disabled={submitting} style={{ padding: '16px 32px', background: submitting ? BORDER : ACCENT, border: 'none', borderRadius: 12, color: submitting ? TEXT_DIM : '#08080f', fontFamily: 'Syne, sans-serif', fontWeight: 700, fontSize: 16, cursor: submitting ? 'wait' : 'pointer', flex: 2 }}>
              {submitting ? 'Submitting...' : tracks.length > 0 ? `Submit with ${tracks.length} Track${tracks.length !== 1 ? 's' : ''}` : 'Submit to RADR'}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════
   FOOTER
   ═══════════════════════════════════════════ */
function Footer() {
  return (
    <footer style={{ borderTop: `1px solid ${BORDER}`, padding: '48px 24px 120px', textAlign: 'center' }}>
      <div style={{ maxWidth: 500, margin: '0 auto' }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, marginBottom: 16 }}>
          <div style={{ width: 24, height: 24, borderRadius: '50%', border: `2px solid ${ACCENT}`, display: 'flex', alignItems: 'center', justifyContent: 'center' }}><div style={{ width: 4, height: 4, borderRadius: '50%', background: ACCENT }} /></div>
          <span style={{ fontFamily: 'Syne, sans-serif', fontWeight: 800, fontSize: 16 }}>RADR</span>
        </div>
        <p style={{ fontSize: 14, color: TEXT_DIM, lineHeight: 1.6, marginBottom: 8 }}>Hear your city. RADR is growing — artist dashboards, scene analytics, and ticket integration are on the way.</p>
        <p style={{ fontSize: 12, color: TEXT_DIM+'80' }}>© 2026 RADR. Real artists. Real places. Real music.</p>
      </div>
    </footer>
  );
}

/* ═══════════════════════════════════════════
   APP — BOOTSTRAPPING
   ═══════════════════════════════════════════ */
function App() {
  const [currentScene, setCurrentScene] = useState(() => loadScene());
  const [page, setPage] = useState('home');
  const [selectedArtist, setSelectedArtist] = useState(null);
  const [currentTrack, setCurrentTrack] = useState(null);
  const [currentArtist, setCurrentArtist] = useState(null);
  const [playing, setPlaying] = useState(false);
  const [progress, setProgress] = useState(0);
  const [suggestSceneOpen, setSuggestSceneOpen] = useState(false);

  // SUPABASE READY — artist data loading
  const [supabaseArtists, setSupabaseArtists] = useState([]);
  const [loading, setLoading] = useState(SUPABASE_CONFIGURED);

  useEffect(() => {
    if (!SUPABASE_CONFIGURED) { setLoading(false); return; }
    fetchApprovedArtists().then(artists => {
      setSupabaseArtists(artists);
      setLoading(false);
    });
  }, []);

  // Supabase artists take priority; samples used as fallback only
  const allArtists = useMemo(() => {
    if (SUPABASE_CONFIGURED && supabaseArtists.length > 0) return supabaseArtists;
    return SAMPLE_ARTISTS;
  }, [supabaseArtists, loading]);

  const scene = SCENES.find(s => s.id === currentScene);

  const handleSceneChange = useCallback((id) => {
    setCurrentScene(id); saveScene(id); window.scrollTo(0, 0);
  }, []);

  useEffect(() => {
    if (!playing || !currentTrack) return;
    if (currentTrack.soundcloudUrl) return;
    const interval = setInterval(() => { setProgress(p => { if (p >= 100) { setPlaying(false); return 0; } return p + 0.5; }); }, 500);
    return () => clearInterval(interval);
  }, [playing, currentTrack]);

  const handlePlay = useCallback((track, artist) => {
    if (currentTrack?.id === track.id) { setPlaying(p => !p); }
    else { setCurrentTrack(track); setCurrentArtist(artist); setPlaying(true); setProgress(0); }
  }, [currentTrack]);

  const handlePageChange = useCallback((p) => { setPage(p); window.scrollTo(0, 0); }, []);
  const handleSuggestScene = useCallback(() => setSuggestSceneOpen(true), []);
  const handleSceneSuggested = useCallback((suggestion) => {
    const existing = loadSuggestedScenes();
    saveSuggestedScenes([...existing, suggestion]);
  }, []);

  const showSceneBar = ['scene', 'discover'].includes(page);

  if (loading) {
    return (
      <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: 16 }}>
        <div style={{ width: 48, height: 48, borderRadius: '50%', border: `3px solid ${BORDER}`, borderTopColor: ACCENT, animation: 'spin 0.8s linear infinite' }} />
        <p style={{ fontFamily: 'Syne, sans-serif', color: TEXT_DIM, fontSize: 14 }}>Loading RADR...</p>
      </div>
    );
  }

  return (
    <div style={{ minHeight: '100vh', paddingBottom: currentTrack ? 72 : 0 }}>
      <Nav page={page} setPage={handlePageChange} currentScene={currentScene} setCurrentScene={handleSceneChange} artists={allArtists} onSuggestScene={handleSuggestScene} />
      {showSceneBar && <SceneSummaryBar scene={scene} artists={allArtists} />}
      {!showSceneBar && <div style={{ height: 64 }} />}
      {page === 'home' && <LandingPage artists={allArtists} setPage={handlePageChange} setCurrentScene={handleSceneChange} onSuggestScene={handleSuggestScene} />}
      {page === 'discover' && <DiscoverPage scene={scene} artists={allArtists} setPage={handlePageChange} setSelectedArtist={setSelectedArtist} onPlay={handlePlay} currentTrack={currentTrack} playing={playing} />}
      {page === 'scene' && <ScenePage scene={scene} artists={allArtists} setPage={handlePageChange} setSelectedArtist={setSelectedArtist} onPlay={handlePlay} currentTrack={currentTrack} playing={playing} />}
      {page === 'artist' && <ArtistProfilePage artist={selectedArtist} scene={scene} artists={allArtists} setPage={handlePageChange} setSelectedArtist={setSelectedArtist} onPlay={handlePlay} currentTrack={currentTrack} playing={playing} />}
      {page === 'submit' && <SubmitPage scenes={SCENES} onSuggestScene={handleSuggestScene} />}
      <Footer />
      <MiniPlayer track={currentTrack} artist={currentArtist} playing={playing} onToggle={() => setPlaying(p => !p)} progress={progress} onProgressChange={p => setProgress(p)} />
      <SuggestSceneModal open={suggestSceneOpen} onClose={() => setSuggestSceneOpen(false)} onSubmit={handleSceneSuggested} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
