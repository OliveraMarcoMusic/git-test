/* ═══════════════════════════════════════════
   UTILITIES
   ═══════════════════════════════════════════ */
const genId = () => '_' + Math.random().toString(36).slice(2, 10);
const getInitials = (name) => name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
const formatPlays = (n) => n >= 1000 ? (n/1000).toFixed(1).replace(/\.0$/,'') + 'K' : String(n);
const formatDate = (d) => new Date(d + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
const isVisiting = (artist, sceneId) => artist.home_scene !== sceneId && artist.active_scenes.includes(sceneId);
const pickColor = () => AVATAR_COLORS[Math.floor(Math.random() * AVATAR_COLORS.length)];

function getSceneArtists(artists, sceneId) { return artists.filter(a => a.home_scene === sceneId || a.active_scenes.includes(sceneId)); }
function getHomeArtists(artists, sceneId) { return artists.filter(a => a.home_scene === sceneId); }
function getVisitingArtists(artists, sceneId) { return artists.filter(a => a.home_scene !== sceneId && a.active_scenes.includes(sceneId)); }
function getSceneShows(artists, sceneId) {
  const sceneArtists = getSceneArtists(artists, sceneId);
  const scene = SCENES.find(s => s.id === sceneId);
  return sceneArtists.flatMap(a => a.shows.map(s => ({...s, artist: a.name, artistId: a.id})))
    .sort((a,b) => new Date(a.date) - new Date(b.date));
}

// localStorage helpers
const STORAGE_KEY = 'radr_community_artists';
function loadCommunityArtists() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; }
}
function saveCommunityArtists(artists) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(artists));
}

   SHARED COMPONENTS

function Avatar({ name, color, size = 48, onClick, style: extra }) {
  return (
    <div onClick={onClick} style={{ width: size, height: size, borderRadius: '50%', background: `linear-gradient(135deg, ${color}, ${color}88)`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'Syne, sans-serif', fontWeight: 700, fontSize: size * 0.38, color: '#08080f', cursor: onClick ? 'pointer' : 'default', flexShrink: 0, ...extra }}>
      {getInitials(name)}
    </div>
  );
}

function Badge({ children, variant = 'default' }) {
  const colors = { default: { bg: '#1a1a2e', color: TEXT_MED }, accent: { bg: ACCENT+'18', color: ACCENT }, visiting: { bg: '#e8405018', color: '#e84050' }, verified: { bg: ACCENT+'18', color: ACCENT }, community: { bg: '#6c5ce718', color: '#a29bfe' } };
  const c = colors[variant] || colors.default;
  return <span style={{ display: 'inline-block', padding: '3px 10px', borderRadius: 20, background: c.bg, color: c.color, fontSize: 11, fontWeight: 600, fontFamily: 'Syne, sans-serif', letterSpacing: '0.02em', textTransform: 'uppercase', whiteSpace: 'nowrap' }}>{children}</span>;
}

function GenreChips({ genres, active, onSelect }) {
  return (
    <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
      {genres.map(g => (
        <button key={g} onClick={() => onSelect && onSelect(g)} style={{
          padding: '6px 16px', borderRadius: 20, border: `1px solid ${active === g ? ACCENT : BORDER}`,
          background: active === g ? ACCENT+'18' : 'transparent', color: active === g ? ACCENT : TEXT_MED,
          fontSize: 13, fontFamily: 'Syne, sans-serif', fontWeight: 500, cursor: onSelect ? 'pointer' : 'default', transition: 'all 0.2s',
        }}>{g}</button>
      ))}
    </div>
  );
}

function Equalizer({ playing }) {
  return (
    <div style={{ display: 'flex', alignItems: 'flex-end', gap: 2, height: 16 }}>
      {[0,1,2,3].map(i => (
        <div key={i} style={{ width: 3, borderRadius: 1.5, background: ACCENT, height: playing ? 4 : 4, animation: playing ? `eq${i} ${0.4+i*0.15}s ease-in-out infinite alternate` : 'none' }} />
      ))}
    </div>
  );
}

function RadarRings() {
  return (
    <div style={{ position: 'absolute', top: '50%', left: '50%', transform: 'translate(-50%, -50%)', width: 600, height: 600, opacity: 0.08, pointerEvents: 'none' }}>
      {[1,2,3,4,5].map(i => (
        <div key={i} style={{ position: 'absolute', top: '50%', left: '50%', width: i*120, height: i*120, border: `1px solid ${ACCENT}`, borderRadius: '50%', transform: 'translate(-50%, -50%)' }} />
      ))}
      <div style={{ position: 'absolute', top: '50%', left: '50%', width: 8, height: 8, background: ACCENT, borderRadius: '50%', transform: 'translate(-50%, -50%)', boxShadow: `0 0 20px ${ACCENT}, 0 0 40px ${ACCENT}44` }} />
    </div>
  );
}

function Card({ children, onClick, style: extra, hover = true }) {
  const [hovered, setHovered] = useState(false);
  return (
    <div onClick={onClick} onMouseEnter={() => setHovered(true)} onMouseLeave={() => setHovered(false)} style={{
      background: hovered && hover ? CARD_BG_HOVER : CARD_BG, border: `1px solid ${hovered && hover ? ACCENT+'30' : BORDER}`,
      borderRadius: 16, padding: 24, cursor: onClick ? 'pointer' : 'default',
      transform: hovered && hover ? 'translateY(-4px)' : 'none', transition: 'all 0.25s cubic-bezier(0.4,0,0.2,1)',
      boxShadow: hovered && hover ? `0 12px 40px rgba(0,229,160,0.06)` : 'none', ...extra
    }}>{children}</div>
  );
}

function Section({ title, subtitle, children, action, style: extra }) {
  return (
    <section style={{ marginBottom: 56, ...extra }}>
      <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', marginBottom: 24, flexWrap: 'wrap', gap: 12 }}>
        <div>
          <h2 style={{ fontFamily: 'Syne, sans-serif', fontWeight: 700, fontSize: 24, letterSpacing: '-0.02em' }}>{title}</h2>
          {subtitle && <p style={{ fontSize: 14, color: TEXT_DIM, marginTop: 4 }}>{subtitle}</p>}
        </div>
        {action}
      </div>
      {children}
    </section>
  );
}

// --- Scene Selector ---
function SceneSelector({ current, onChange }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => { const h = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }; document.addEventListener('mousedown', h); return () => document.removeEventListener('mousedown', h); }, []);
  const scene = SCENES.find(s => s.id === current);
  return (
    <div ref={ref} style={{ position: 'relative' }}>
      <button onClick={() => setOpen(!open)} style={{ background: 'transparent', border: `1px solid ${BORDER}`, borderRadius: 8, padding: '8px 16px', color: ACCENT, fontFamily: 'Syne, sans-serif', fontWeight: 600, fontSize: 14, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 8, transition: 'border-color 0.2s' }}>
        <span style={{ width: 8, height: 8, borderRadius: '50%', background: ACCENT, boxShadow: `0 0 8px ${ACCENT}` }} />
        {scene?.name}
        <span style={{ fontSize: 10, opacity: 0.7 }}>▼</span>
      </button>
      {open && (
        <div style={{ position: 'absolute', top: '100%', right: 0, marginTop: 8, background: '#12121f', border: `1px solid ${BORDER}`, borderRadius: 12, padding: 8, minWidth: 240, zIndex: 1000, boxShadow: '0 16px 48px rgba(0,0,0,0.5)' }}>
          <div style={{ padding: '8px 12px', fontSize: 11, color: TEXT_DIM, fontFamily: 'Syne, sans-serif', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.08em' }}>Select Scene</div>
          {SCENES.map(s => (
            <button key={s.id} onClick={() => { onChange(s.id); setOpen(false); }} style={{ display: 'block', width: '100%', textAlign: 'left', padding: '10px 12px', background: s.id === current ? ACCENT+'10' : 'transparent', border: 'none', borderRadius: 8, color: s.id === current ? ACCENT : '#e8e8ec', fontSize: 14, fontFamily: 'Syne, sans-serif', fontWeight: s.id === current ? 600 : 400, cursor: 'pointer' }}
              onMouseEnter={e => e.target.style.background = s.id === current ? ACCENT+'10' : '#1a1a2e'} onMouseLeave={e => e.target.style.background = s.id === current ? ACCENT+'10' : 'transparent'}>
              {s.name}
              <span style={{ display: 'block', fontSize: 11, color: TEXT_DIM, marginTop: 2 }}>{s.cities.join(', ')}</span>
            </button>
          ))}
        </div>
      )}
    </div>
  );

/* ═══════════════════════════════════════════
   SOUNDCLOUD PLAYER + MINI PLAYER
   ═══════════════════════════════════════════ */

function MiniPlayer({ track, artist, playing, onToggle, progress, onProgressChange }) {
  const iframeRef = useRef(null);
  const widgetRef = useRef(null);
  const hasSC = track && !!track.soundcloudUrl;

  // Initialize / update SoundCloud widget
  useEffect(() => {
    if (!hasSC || !iframeRef.current) return;
    const widget = SC.Widget(iframeRef.current);
    widgetRef.current = widget;
    widget.bind(SC.Widget.Events.READY, () => {
      widget.bind(SC.Widget.Events.PLAY_PROGRESS, (data) => {
        onProgressChange(data.relativePosition * 100);
      });
      widget.bind(SC.Widget.Events.FINISH, () => { onToggle(false); });
      if (playing) widget.play();
    });
    return () => { widgetRef.current = null; };
  }, [track?.soundcloudUrl]);

  // Sync play/pause with widget
  useEffect(() => {
    if (!hasSC || !widgetRef.current) return;
    if (playing) widgetRef.current.play();
    else widgetRef.current.pause();
  }, [playing, hasSC]);

  if (!track) return null;

  return (
    <div style={{ position: 'fixed', bottom: 0, left: 0, right: 0, background: '#0c0c18ee', backdropFilter: 'blur(20px)', borderTop: `1px solid ${BORDER}`, zIndex: 200 }}>
      {/* Hidden SoundCloud iframe */}
      {hasSC && (
        <iframe ref={iframeRef} key={track.soundcloudUrl} src={`https://w.soundcloud.com/player/?url=${encodeURIComponent(track.soundcloudUrl)}&color=%2300e5a0&auto_play=${playing}&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false`}
          width="0" height="0" frameBorder="0" allow="autoplay" style={{ position: 'absolute', opacity: 0, pointerEvents: 'none' }} />
      )}
      {/* Progress bar */}
      <div style={{ height: 3, background: BORDER }}>
        <div style={{ width: `${progress}%`, height: '100%', background: ACCENT, transition: hasSC ? 'none' : 'width 1s linear', borderRadius: 2 }} />
      </div>
      {/* Controls */}
      <div style={{ height: 68, display: 'flex', alignItems: 'center', padding: '0 24px', gap: 16 }}>
        <Avatar name={artist.name} color={artist.color} size={42} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 14, fontWeight: 600, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{track.title}</div>
          <div style={{ fontSize: 12, color: TEXT_DIM, display: 'flex', alignItems: 'center', gap: 6 }}>
            {artist.name}
            {hasSC && <span style={{ color: '#ff5500', fontSize: 10, fontWeight: 700 }}>● SOUNDCLOUD</span>}
            {!hasSC && <span style={{ color: TEXT_DIM, fontSize: 10 }}>● DEMO</span>}
          </div>
        </div>
        <Equalizer playing={playing} />
        <button onClick={() => onToggle()} style={{ width: 40, height: 40, borderRadius: '50%', background: ACCENT, border: 'none', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', fontSize: 16, color: '#08080f', fontWeight: 700, flexShrink: 0 }}>
          {playing ? '❚❚' : '▶'}
        </button>
        <span style={{ fontSize: 12, color: TEXT_DIM, width: 40, textAlign: 'right' }}>{track.duration}</span>
      </div>
    </div>
  );
}

  const visiting = isVisiting(artist, scene.id);
  const homeScene = SCENES.find(s => s.id === artist.home_scene);
  const related = artists.filter(a => a.id !== artist.id && (a.home_scene === artist.home_scene || a.genres.some(g => artist.genres.includes(g)))).slice(0, 3);
  return (
    <div style={{ maxWidth: 800, margin: '0 auto', padding: '100px 24px 120px' }}>
      <button onClick={() => setPage('discover')} style={{ background: 'none', border: 'none', color: TEXT_DIM, fontFamily: 'Syne, sans-serif', fontSize: 13, cursor: 'pointer', marginBottom: 32, display: 'flex', alignItems: 'center', gap: 6 }}>← Back to Discover</button>
      <div style={{ display: 'flex', alignItems: 'flex-start', gap: 24, marginBottom: 40, flexWrap: 'wrap' }}>
        <Avatar name={artist.name} color={artist.color} size={96} />
        <div style={{ flex: 1, minWidth: 200 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap', marginBottom: 8 }}>
            <h1 style={{ fontFamily: 'Syne, sans-serif', fontWeight: 800, fontSize: 32, letterSpacing: '-0.02em' }}>{artist.name}</h1>
            {artist.verified && <Badge variant="verified">✓ Verified Local</Badge>}
            {artist.community && <Badge variant="community">Community Artist</Badge>}
            {visiting && <Badge variant="visiting">Visiting Artist</Badge>}
          </div>
          <p style={{ fontSize: 14, color: TEXT_DIM, marginBottom: 12 }}>{artist.city} · {homeScene?.name} scene</p>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginBottom: 16 }}>{artist.genres.map(g => <Badge key={g}>{g}</Badge>)}</div>
          <p style={{ fontSize: 15, color: TEXT_MED, lineHeight: 1.7 }}>{artist.bio}</p>
        </div>
      </div>
      <div style={{ display: 'flex', gap: 12, marginBottom: 48 }}>
        <button style={{ padding: '12px 28px', background: ACCENT, border: 'none', borderRadius: 10, color: '#08080f', fontFamily: 'Syne, sans-serif', fontWeight: 700, fontSize: 14, cursor: 'pointer' }}>Support Artist</button>
        <button style={{ padding: '12px 28px', background: 'transparent', border: `1px solid ${BORDER}`, borderRadius: 10, color: '#e8e8ec', fontFamily: 'Syne, sans-serif', fontWeight: 600, fontSize: 14, cursor: 'pointer' }}>Book for Show</button>
      </div>
      <Section title="Tracks">
        {artist.tracks.length > 0 ? (
          <Card hover={false} style={{ padding: 8 }}>
            {artist.tracks.map((t, i) => <TrackRow key={t.id||t.title} track={t} index={i} artist={artist} isPlaying={currentTrack?.id === t.id && playing} onPlay={() => onPlay(t, artist)} />)}
          </Card>
        ) : (
          <Card hover={false} style={{ textAlign: 'center', padding: 40, color: TEXT_DIM }}>
            <p>No tracks yet. This artist hasn't added any music.</p>
          </Card>
        )}
      </Section>
      {artist.shows.length > 0 && <Section title="Upcoming Shows"><Card hover={false}>{artist.shows.map((s,i) => <ShowRow key={i} show={{...s, artist: artist.name, artistId: artist.id}} />)}</Card></Section>}
      {related.length > 0 && (
        <Section title="Related Artists" subtitle={`From the ${homeScene?.name} scene`}>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(240px, 1fr))', gap: 16 }}>
            {related.map(a => (
              <Card key={a.id} onClick={() => { setSelectedArtist(a); window.scrollTo(0,0); }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                  <Avatar name={a.name} color={a.color} size={40} />
                  <div>
                    <div style={{ fontFamily: 'Syne, sans-serif', fontWeight: 600, fontSize: 14 }}>{a.name}</div>
                    <div style={{ fontSize: 12, color: TEXT_DIM }}>{a.genres.slice(0,2).join(', ')}</div>
                  </div>
                </div>
              </Card>
            ))}
          </div>
        </Section>
      )}
    </div>
  );
}

// --- SUBMIT / JOIN PAGE ---
function SubmitPage({ scenes, onArtistAdded }) {
  const [step, setStep] = useState(1); // 1: info, 2: tracks, 3: done
  const [form, setForm] = useState({ name: '', type: 'solo', email: '', city: '', home_scene: '', active_scenes: [], genres: [], bio: '', socials: '', upcoming_shows: '', human_confirmed: false });
  const [tracks, setTracks] = useState([]);
  const [trackInput, setTrackInput] = useState({ title: '', soundcloudUrl: '', duration: '' });
  const update = (field, value) => setForm(f => ({...f, [field]: value}));

  const addTrack = () => {
    if (!trackInput.title) return;
    setTracks(t => [...t, { id: genId(), title: trackInput.title, soundcloudUrl: trackInput.soundcloudUrl || null, duration: trackInput.duration || '3:30', plays: 0 }]);
    setTrackInput({ title: '', soundcloudUrl: '', duration: '' });
  };
  const removeTrack = (id) => setTracks(t => t.filter(tr => tr.id !== id));

  const submitArtist = () => {
    const newArtist = {
      id: genId(),
      name: form.name,
      city: form.city,
      home_scene: form.home_scene,
      active_scenes: [form.home_scene, ...form.active_scenes.filter(s => s !== form.home_scene)],
      genres: form.genres,
      verified: false,
      community: true,
      bio: form.bio || `Independent artist from ${form.city}. New to RADR.`,
      color: pickColor(),
      tracks: tracks,
      shows: form.upcoming_shows ? form.upcoming_shows.split('\n').filter(Boolean).map(line => {
        const parts = line.split(',').map(s => s.trim());
        return { venue: parts[1] || 'TBA', city: parts[2] || form.city, date: parts[0] || '2026-05-01', time: parts[3] || '8:00 PM' };
      }) : [],
    };
    onArtistAdded(newArtist);
    setStep(3);
  };

  const inputStyle = { width: '100%', padding: '12px 16px', background: '#0a0a16', border: `1px solid ${BORDER}`, borderRadius: 10, color: '#e8e8ec', fontSize: 14, outline: 'none' };
  const labelStyle = { display: 'block', fontFamily: 'Syne, sans-serif', fontWeight: 600, fontSize: 13, marginBottom: 8, color: TEXT_MED };
  const canProceed1 = form.name && form.email && form.home_scene && form.human_confirmed;

  // Step 3: Success
  if (step === 3) return (
    <div style={{ maxWidth: 600, margin: '0 auto', padding: '160px 24px', textAlign: 'center' }}>
      <div style={{ width: 64, height: 64, borderRadius: '50%', background: ACCENT+'20', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 24px', fontSize: 28, color: ACCENT }}>✓</div>
      <h1 style={{ fontFamily: 'Syne, sans-serif', fontWeight: 800, fontSize: 32, marginBottom: 12 }}>You're on RADR</h1>
      <p style={{ color: TEXT_MED, fontSize: 16, lineHeight: 1.6, marginBottom: 32 }}>Your profile is live in the {SCENES.find(s=>s.id===form.home_scene)?.name} scene. Switch to your scene to see yourself in the artist list.</p>
      <button onClick={() => { setStep(1); setForm({ name: '', type: 'solo', email: '', city: '', home_scene: '', active_scenes: [], genres: [], bio: '', socials: '', upcoming_shows: '', human_confirmed: false }); setTracks([]); }} style={{ padding: '12px 24px', background: 'transparent', border: `1px solid ${BORDER}`, borderRadius: 10, color: '#e8e8ec', fontFamily: 'Syne, sans-serif', fontWeight: 600, fontSize: 14, cursor: 'pointer' }}>Add Another Artist</button>
    </div>
  );

  return (
    <div style={{ maxWidth: 640, margin: '0 auto', padding: '100px 24px 120px' }}>
      <h1 style={{ fontFamily: 'Syne, sans-serif', fontWeight: 800, fontSize: 36, marginBottom: 8 }}>Join RADR</h1>
      <p style={{ color: TEXT_DIM, fontSize: 16, marginBottom: 16 }}>Add yourself to your local scene. No approval process — you'll appear instantly.</p>

      {/* Step indicator */}
      <div style={{ display: 'flex', gap: 8, marginBottom: 40 }}>
        {[{ n: 1, label: 'Your Info' }, { n: 2, label: 'Your Music' }].map(s => (
          <div key={s.n} style={{ flex: 1, padding: '10px 16px', borderRadius: 10, background: step === s.n ? ACCENT+'15' : CARD_BG, border: `1px solid ${step === s.n ? ACCENT+'40' : BORDER}`, textAlign: 'center' }}>
            <span style={{ fontFamily: 'Syne, sans-serif', fontWeight: 600, fontSize: 12, color: step === s.n ? ACCENT : TEXT_DIM }}>Step {s.n}: {s.label}</span>
          </div>
        ))}
      </div>

      {/* Step 1: Info */}
      {step === 1 && (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 24 }}>
          <div className="grid-2col" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
            <div>
              <label style={labelStyle}>Artist / Band Name *</label>
              <input style={inputStyle} value={form.name} onChange={e => update('name', e.target.value)} placeholder="Your name or band name" onFocus={e => e.target.style.borderColor = ACCENT} onBlur={e => e.target.style.borderColor = BORDER} />
            </div>
            <div>
              <label style={labelStyle}>Type</label>
              <select style={{...inputStyle, cursor: 'pointer'}} value={form.type} onChange={e => update('type', e.target.value)}>
                <option value="solo">Solo Artist</option><option value="band">Band</option><option value="duo">Duo</option><option value="collective">Collective</option>
              </select>
            </div>
          </div>
          <div>
            <label style={labelStyle}>Email *</label>
            <input style={inputStyle} type="email" value={form.email} onChange={e => update('email', e.target.value)} placeholder="you@email.com" onFocus={e => e.target.style.borderColor = ACCENT} onBlur={e => e.target.style.borderColor = BORDER} />
          </div>
          <div className="grid-2col" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
            <div>
              <label style={labelStyle}>City *</label>
              <input style={inputStyle} value={form.city} onChange={e => update('city', e.target.value)} placeholder="Your city" onFocus={e => e.target.style.borderColor = ACCENT} onBlur={e => e.target.style.borderColor = BORDER} />
            </div>
            <div>
              <label style={labelStyle}>Home Scene *</label>
              <select style={{...inputStyle, cursor: 'pointer'}} value={form.home_scene} onChange={e => update('home_scene', e.target.value)}>
                <option value="">Select your scene</option>
                {scenes.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
              </select>
            </div>
          </div>
          <div>
            <label style={labelStyle}>Also active in (select scenes you tour)</label>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
              {scenes.filter(s => s.id !== form.home_scene).map(s => {
                const active = form.active_scenes.includes(s.id);
                return <button key={s.id} type="button" onClick={() => update('active_scenes', active ? form.active_scenes.filter(x => x !== s.id) : [...form.active_scenes, s.id])} style={{ padding: '6px 14px', borderRadius: 20, border: `1px solid ${active ? ACCENT : BORDER}`, background: active ? ACCENT+'18' : 'transparent', color: active ? ACCENT : TEXT_DIM, fontSize: 12, fontFamily: 'Syne, sans-serif', cursor: 'pointer' }}>{s.name}</button>;
              })}
            </div>
          </div>
          <div>
            <label style={labelStyle}>Genres (select up to 3)</label>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
              {GENRES.map(g => {
                const active = form.genres.includes(g);
                return <button key={g} type="button" onClick={() => { if (active) update('genres', form.genres.filter(x => x !== g)); else if (form.genres.length < 3) update('genres', [...form.genres, g]); }} style={{ padding: '6px 14px', borderRadius: 20, border: `1px solid ${active ? ACCENT : BORDER}`, background: active ? ACCENT+'18' : 'transparent', color: active ? ACCENT : TEXT_DIM, fontSize: 12, fontFamily: 'Syne, sans-serif', cursor: 'pointer' }}>{g}</button>;
              })}
            </div>
          </div>
          <div>
            <label style={labelStyle}>Bio</label>
            <textarea style={{...inputStyle, minHeight: 100, resize: 'vertical'}} value={form.bio} onChange={e => update('bio', e.target.value)} placeholder="Tell listeners about your sound, story, and scene." onFocus={e => e.target.style.borderColor = ACCENT} onBlur={e => e.target.style.borderColor = BORDER} />
          </div>
          <div>
            <label style={labelStyle}>Social Media</label>
            <input style={inputStyle} value={form.socials} onChange={e => update('socials', e.target.value)} placeholder="@handles or links" onFocus={e => e.target.style.borderColor = ACCENT} onBlur={e => e.target.style.borderColor = BORDER} />
          </div>
          <div>
            <label style={labelStyle}>Upcoming Shows (one per line: date, venue, city, time)</label>
            <textarea style={{...inputStyle, minHeight: 60, resize: 'vertical'}} value={form.upcoming_shows} onChange={e => update('upcoming_shows', e.target.value)} placeholder="2026-05-01, Songbyrd, Washington DC, 8:00 PM" onFocus={e => e.target.style.borderColor = ACCENT} onBlur={e => e.target.style.borderColor = BORDER} />
          </div>
          <label style={{ display: 'flex', alignItems: 'flex-start', gap: 12, cursor: 'pointer', padding: 16, background: CARD_BG, borderRadius: 12, border: `1px solid ${BORDER}` }}>
            <input type="checkbox" checked={form.human_confirmed} onChange={e => update('human_confirmed', e.target.checked)} style={{ marginTop: 2, accentColor: ACCENT, width: 18, height: 18 }} />
            <div>
              <div style={{ fontFamily: 'Syne, sans-serif', fontWeight: 600, fontSize: 14 }}>I am a real human performer</div>
              <div style={{ fontSize: 12, color: TEXT_DIM, marginTop: 4 }}>I confirm that I (or my band) perform live music and that my submitted content is original.</div>
            </div>
          </label>
          <button onClick={() => canProceed1 && setStep(2)} style={{
            padding: '16px 32px', background: canProceed1 ? ACCENT : BORDER, border: 'none', borderRadius: 12,
            color: canProceed1 ? '#08080f' : TEXT_DIM, fontFamily: 'Syne, sans-serif', fontWeight: 700, fontSize: 16,
            cursor: canProceed1 ? 'pointer' : 'not-allowed', width: '100%',
          }}>Next: Add Your Music →</button>
        </div>
      )}

      {/* Step 2: Tracks */}
      {step === 2 && (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 24 }}>
          <Card hover={false} style={{ background: '#0a0a16', border: `1px solid ${ACCENT}20` }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16 }}>
              <span style={{ color: '#ff5500', fontSize: 20 }}>☁</span>
              <div>
                <div style={{ fontFamily: 'Syne, sans-serif', fontWeight: 700, fontSize: 16 }}>Link SoundCloud Tracks</div>
                <div style={{ fontSize: 13, color: TEXT_DIM }}>Paste your SoundCloud track URLs for instant streaming on RADR. Or add track info without a link — it'll show as a demo.</div>
              </div>
            </div>
          </Card>

          {/* Track input form */}
          <div style={{ padding: 20, background: CARD_BG, borderRadius: 14, border: `1px solid ${BORDER}` }}>
            <label style={labelStyle}>Add a Track</label>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
              <input style={inputStyle} placeholder="Track title *" value={trackInput.title} onChange={e => setTrackInput(t => ({...t, title: e.target.value}))} onFocus={e => e.target.style.borderColor = ACCENT} onBlur={e => e.target.style.borderColor = BORDER} />
              <input style={inputStyle} placeholder="SoundCloud URL (optional — e.g. https://soundcloud.com/artist/track)" value={trackInput.soundcloudUrl} onChange={e => setTrackInput(t => ({...t, soundcloudUrl: e.target.value}))} onFocus={e => e.target.style.borderColor = '#ff5500'} onBlur={e => e.target.style.borderColor = BORDER} />
              <div style={{ display: 'flex', gap: 12 }}>
                <input style={{...inputStyle, maxWidth: 120}} placeholder="Duration" value={trackInput.duration} onChange={e => setTrackInput(t => ({...t, duration: e.target.value}))} onFocus={e => e.target.style.borderColor = ACCENT} onBlur={e => e.target.style.borderColor = BORDER} />
                <button onClick={addTrack} disabled={!trackInput.title} style={{ padding: '12px 24px', background: trackInput.title ? ACCENT : BORDER, border: 'none', borderRadius: 10, color: trackInput.title ? '#08080f' : TEXT_DIM, fontFamily: 'Syne, sans-serif', fontWeight: 700, fontSize: 14, cursor: trackInput.title ? 'pointer' : 'not-allowed', whiteSpace: 'nowrap' }}>+ Add Track</button>
              </div>
            </div>
          </div>

          {/* Track list */}
          {tracks.length > 0 && (
            <div>
              <label style={{...labelStyle, marginBottom: 12}}>{tracks.length} track{tracks.length !== 1 ? 's' : ''} added</label>
              {tracks.map((t, i) => (
                <div key={t.id} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '12px 16px', background: CARD_BG, borderRadius: 10, marginBottom: 8, border: `1px solid ${BORDER}` }}>
                  <span style={{ fontFamily: 'Syne, sans-serif', fontSize: 13, color: TEXT_DIM, width: 24 }}>{i+1}</span>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 14, fontWeight: 500 }}>{t.title}</div>
                    <div style={{ fontSize: 11, color: t.soundcloudUrl ? '#ff5500' : TEXT_DIM }}>{t.soundcloudUrl ? '● SoundCloud linked' : '● Demo (no stream)'}</div>
                  </div>
                  <span style={{ fontSize: 12, color: TEXT_DIM }}>{t.duration}</span>
                  <button onClick={() => removeTrack(t.id)} style={{ background: 'none', border: 'none', color: '#e84050', cursor: 'pointer', fontSize: 16, padding: 4 }}>×</button>
                </div>
              ))}
            </div>
          )}

          <div style={{ display: 'flex', gap: 12 }}>
            <button onClick={() => setStep(1)} style={{ padding: '16px 24px', background: 'transparent', border: `1px solid ${BORDER}`, borderRadius: 12, color: '#e8e8ec', fontFamily: 'Syne, sans-serif', fontWeight: 600, fontSize: 15, cursor: 'pointer', flex: 1 }}>← Back</button>
            <button onClick={submitArtist} style={{ padding: '16px 32px', background: ACCENT, border: 'none', borderRadius: 12, color: '#08080f', fontFamily: 'Syne, sans-serif', fontWeight: 700, fontSize: 16, cursor: 'pointer', flex: 2 }}>
              {tracks.length > 0 ? `Join RADR with ${tracks.length} Track${tracks.length !== 1 ? 's' : ''}` : 'Join RADR (add tracks later)'}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// --- Footer ---
function Footer() {
  return (
    <footer style={{ borderTop: `1px solid ${BORDER}`, padding: '48px 24px 120px', textAlign: 'center' }}>
      <div style={{ maxWidth: 500, margin: '0 auto' }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, marginBottom: 16 }}>
          <div style={{ width: 24, height: 24, borderRadius: '50%', border: `2px solid ${ACCENT}`, display: 'flex', alignItems: 'center', justifyContent: 'center' }}><div style={{ width: 4, height: 4, borderRadius: '50%', background: ACCENT }} /></div>
          <span style={{ fontFamily: 'Syne, sans-serif', fontWeight: 800, fontSize: 16 }}>RADR</span>
        </div>
        <p style={{ fontSize: 14, color: TEXT_DIM, lineHeight: 1.6, marginBottom: 8 }}>Hear your city. The full RADR platform is coming soon — artist dashboards, scene analytics, ticket integration, and more.</p>
        <p style={{ fontSize: 12, color: TEXT_DIM+'80' }}>© 2026 RADR. Real artists. Real places. Real music.</p>
      </div>
    </footer>
  );
}

/* ═══════════════════════════════════════════
   APP
   ═══════════════════════════════════════════ */
function App() {
  const [currentScene, setCurrentScene] = useState('dmv');
  const [page, setPage] = useState('home');
  const [selectedArtist, setSelectedArtist] = useState(null);
  const [currentTrack, setCurrentTrack] = useState(null);
  const [currentArtist, setCurrentArtist] = useState(null);
  const [playing, setPlaying] = useState(false);
  const [progress, setProgress] = useState(0);
  const [communityArtists, setCommunityArtists] = useState(() => loadCommunityArtists());

  // Merge seed + community artists
  const allArtists = useMemo(() => [...SEED_ARTISTS, ...communityArtists], [communityArtists]);

  const scene = SCENES.find(s => s.id === currentScene);

  // Mock progress for non-SoundCloud tracks
  useEffect(() => {
    if (!playing || !currentTrack) return;
    if (currentTrack.soundcloudUrl) return; // SoundCloud handles its own progress
    const interval = setInterval(() => {
      setProgress(p => { if (p >= 100) { setPlaying(false); return 0; } return p + 0.5; });
    }, 500);
    return () => clearInterval(interval);
  }, [playing, currentTrack]);

  const handlePlay = useCallback((track, artist) => {
    if (currentTrack?.id === track.id) {
      setPlaying(p => !p);
    } else {
      setCurrentTrack(track);
      setCurrentArtist(artist);
      setPlaying(true);
      setProgress(0);
    }
  }, [currentTrack]);

  const handlePageChange = useCallback((p) => { setPage(p); window.scrollTo(0, 0); }, []);

  const handleArtistAdded = useCallback((newArtist) => {
    setCommunityArtists(prev => {
      const updated = [...prev, newArtist];
      saveCommunityArtists(updated);
      return updated;
    });
  }, []);

  const handleProgressChange = useCallback((p) => setProgress(p), []);

  return (
    <div style={{ minHeight: '100vh', paddingBottom: currentTrack ? 72 : 0 }}>
      <Nav page={page} setPage={handlePageChange} currentScene={currentScene} setCurrentScene={setCurrentScene} />
      {page === 'home' && <HomePage scene={scene} artists={allArtists} setPage={handlePageChange} setSelectedArtist={setSelectedArtist} onPlay={handlePlay} currentTrack={currentTrack} playing={playing} />}
      {page === 'discover' && <DiscoverPage scene={scene} artists={allArtists} setPage={handlePageChange} setSelectedArtist={setSelectedArtist} onPlay={handlePlay} currentTrack={currentTrack} playing={playing} />}
      {page === 'scene' && <SceneHubPage scene={scene} artists={allArtists} setPage={handlePageChange} setSelectedArtist={setSelectedArtist} onPlay={handlePlay} currentTrack={currentTrack} playing={playing} />}
      {page === 'artist' && <ArtistProfilePage artist={selectedArtist} scene={scene} artists={allArtists} setPage={handlePageChange} setSelectedArtist={setSelectedArtist} onPlay={handlePlay} currentTrack={currentTrack} playing={playing} />}
      {page === 'submit' && <SubmitPage scenes={SCENES} onArtistAdded={handleArtistAdded} />}
      <Footer />
      <MiniPlayer track={currentTrack} artist={currentArtist} playing={playing} onToggle={() => setPlaying(p => !p)} progress={progress} onProgressChange={handleProgressChange} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
